name: campusbite

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: campusbite
      POSTGRES_PASSWORD: campusbite
      POSTGRES_DB: campusbite
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusbite -d campusbite"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts here run only when the pgdata volume is first created.
      - ./backend/docker/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"

  api:
    build: ./backend
    # Copy backend/.env.example to backend/.env and set JWT_SECRET before starting.
    env_file: backend/.env
    # `environment` takes precedence over `env_file`, so the container always
    # talks to the compose `db` service regardless of the DATABASE_URL in backend/.env.
    environment:
      DATABASE_URL: postgresql+psycopg://campusbite:campusbite@db:5432/campusbite
      TEST_DATABASE_URL: postgresql+psycopg://campusbite:campusbite@db:5432/campusbite_test
      ENABLE_SCHEDULER: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
