# Alembic configuration for CampusBite.
# The database URL is NOT set here: alembic/env.py reads DATABASE_URL from the
# application settings (environment variable or backend/.env).

[alembic]
# Path to the migration scripts, resolved relative to this file so the commands
# work from the backend directory locally and from /app inside the container.
script_location = %(here)s/alembic

# Make `import app...` work when alembic runs from the backend directory.
prepend_sys_path = .

# Timezone-less, sortable revision ids are used (0001, 0002, ...), so no
# file_template / timezone settings are needed.

# Interpret the Alembic version table location and file encoding.
output_encoding = utf-8

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
