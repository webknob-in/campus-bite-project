[project]
name = "campusbite-api"
version = "0.1.0"
requires-python = ">=3.11"
# Keep in sync with requirements.txt (Vercel installs from pyproject.toml when present).
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2.0",
    "pydantic-settings",
    "email-validator",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic",
    "pyjwt",
    "bcrypt",
    "apscheduler",
    "openai",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
